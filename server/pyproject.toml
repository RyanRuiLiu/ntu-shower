[project]
name = "ntu-shower-server"
version = "0.7.5"
description = "NTU 浴室系统服务端：设备网关 / 用户 API / 管理面 / OTA（FastAPI 模块化单体）"
requires-python = ">=3.13"
# 抽象依赖（兼容范围）。精确锁定版本见 requirements.txt——PyPA 标准分工：
# pyproject 表达"能兼容什么"，requirements.txt 表达"生产上跑什么"。
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "websockets>=17.0",
]

# ─────────────────────────────────────────────────────────────
# 代码风格强制机制
# ─────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（导入排序）
    "N",   # pep8-naming（命名规范）
    "UP",  # pyupgrade（现代语法）
    "B",   # flake8-bugbear（常见缺陷）
    "A",   # flake8-builtins（禁止遮蔽内建名）
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # ruff 专有规则
    "ANN", # flake8-annotations（类型注解完整性）
    "TRY", # tryceratops（异常处理规范）
    "BLE", # flake8-blind-except（禁止盲捕获）
    "EM",  # flake8-errmsg（异常消息规范）
    "PT",  # flake8-pytest-style（测试风格统一）
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
    "TD",  # flake8-todos
]
ignore = [
    # 中文文档与注释中的全角标点是正常排版，非"视觉歧义字符"
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入的 File()/Header()/Depends() 默认值是框架标准用法
"app/**/routes.py" = ["B008"]
"app/**/dependencies.py" = ["B008"]
# pytest fixture 参数靠"声明"触发副作用（建隔离库、打补丁），不必然参与取值；
# 强制这些参数必须被使用等于与框架机制对抗，故在测试范围内豁免未用参数规则。
"tests/**" = ["ARG001", "ARG002"]

# ─────────────────────────────────────────────────────────────
# 类型检查强制机制
# ─────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# 测试与覆盖率门
# ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` 包的导入要靠 server/ 在 sys.path 上：裸 `pytest` 不注入当前目录
# （`python -m pytest` 才注入），不声明它，CI 上 conftest 第一步就 ImportError。
pythonpath = ["."]
# 单条用例的超时上限。正常用例在 1 秒内（最慢的是端口退避重试，1.25 秒），
# 超过 5 秒就说明它在等待一个永不到来的事件——例如权限被拒后，"等设备回帧"
# 的用例永远等不到。这道闸要卡得紧：宽到 30 秒等于没卡，一次挂起就是白等半分钟。
timeout = 5
timeout_method = "thread"
# 全量 1062 条串行约 65 秒；本机（32 核）实测：6 进程 14.5s / 12 进程 12.9s /
# 18 进程 14.1s / auto(32) 16.4s——峰值在 12，过多进程的调度开销反超并行收益。
# 覆盖率在并行下由 pytest-cov 合并各进程数据，统计已验证正确。
# 需要串行时用 `pytest -n 0` 覆盖。
addopts = "-ra --strict-markers -n 12"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# 门槛跟随实际水平上移，只升不降；具体数值见 CI 输出
fail_under = 96
show_missing = true
# 赦免机制：不可在测试进程内复现的分支须就地标注原因
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]

# 架构边界：import-linter 官方契约（forbidden / independence）
# https://import-linter.readthedocs.io/en/stable/contract_types.html
#
# 结构（Spring Modulith 的模块化单体模型，白名单边写死在这里）：
# - 组合根 main 在顶，唯一 import 全部模块；gateway / auth 是核心域；
# - 共享模块：config（配置中心）、devices（设备命令平面）——任何域可引用；
# - 业务模块彼此零引用（independence），声明边逐条列在 forbidden 里：
#     sessions → doors（分配预检读门现态）
#     extend_hours → sessions、doors（续期判据与门现态）
#     jobs → extend_hours、sessions（看板读两域的即时状态）
#     status_line → doors（楼层汇总读门现态）
#     voice → doors（规则目标校验读门现态）
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "核心层零向上依赖"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.auth", "app.contracts", "app.gateway", "app.modules", "app.persistence", "app.db"]

[[tool.importlinter.contracts]]
name = "共享契约零向上依赖"
type = "forbidden"
source_modules = ["app.contracts"]
forbidden_modules = ["app.auth", "app.gateway", "app.modules", "app.persistence", "app.db"]

[[tool.importlinter.contracts]]
name = "持久化层不依赖上层"
type = "forbidden"
source_modules = ["app.persistence"]
forbidden_modules = ["app.auth", "app.gateway", "app.modules"]

[[tool.importlinter.contracts]]
name = "组合根不被反向引用"
type = "forbidden"
source_modules = ["app.auth", "app.gateway", "app.modules", "app.persistence"]
forbidden_modules = ["app.main"]

[[tool.importlinter.contracts]]
name = "业务模块彼此零引用（一）"
type = "independence"
modules = ["app.modules.audit", "app.modules.bridge", "app.modules.freelist", "app.modules.ota", "app.modules.water"]

[[tool.importlinter.contracts]]
name = "业务模块彼此零引用（二）"
type = "independence"
modules = ["app.modules.audit", "app.modules.doors", "app.modules.freelist", "app.modules.ota", "app.modules.water"]

# 以下五条 = 声明边之外的组合一律禁止（含 jobs / sessions / extend_hours 的白名单）
[[tool.importlinter.contracts]]
name = "sessions 只许引用 doors"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.sessions"]
forbidden_modules = [
    "app.modules.audit",
    "app.modules.bridge",
    "app.modules.extend_hours",
    "app.modules.freelist",
    "app.modules.jobs",
    "app.modules.ota",
    "app.modules.status_line",
    "app.modules.voice",
    "app.modules.water",
]

[[tool.importlinter.contracts]]
name = "extend_hours 只许引用 sessions 与 doors"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.extend_hours"]
forbidden_modules = [
    "app.modules.audit",
    "app.modules.bridge",
    "app.modules.freelist",
    "app.modules.jobs",
    "app.modules.ota",
    "app.modules.status_line",
    "app.modules.voice",
    "app.modules.water",
]

[[tool.importlinter.contracts]]
name = "jobs 只许引用 extend_hours 与 sessions"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.jobs"]
forbidden_modules = [
    "app.modules.audit",
    "app.modules.bridge",
    "app.modules.doors",
    "app.modules.freelist",
    "app.modules.ota",
    "app.modules.status_line",
    "app.modules.voice",
    "app.modules.water",
]

[[tool.importlinter.contracts]]
name = "status_line 只许引用 doors"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.status_line"]
forbidden_modules = [
    "app.modules.audit",
    "app.modules.bridge",
    "app.modules.extend_hours",
    "app.modules.freelist",
    "app.modules.jobs",
    "app.modules.ota",
    "app.modules.sessions",
    "app.modules.voice",
    "app.modules.water",
]

[[tool.importlinter.contracts]]
name = "voice 只许引用 doors"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.voice"]
forbidden_modules = [
    "app.modules.audit",
    "app.modules.bridge",
    "app.modules.extend_hours",
    "app.modules.freelist",
    "app.modules.jobs",
    "app.modules.ota",
    "app.modules.sessions",
    "app.modules.status_line",
    "app.modules.water",
]

[[tool.importlinter.contracts]]
name = "doors 不引用任何业务模块"
type = "forbidden"
source_modules = ["app.modules.doors"]
forbidden_modules = [
    "app.modules.audit",
    "app.modules.bridge",
    "app.modules.extend_hours",
    "app.modules.freelist",
    "app.modules.jobs",
    "app.modules.ota",
    "app.modules.sessions",
    "app.modules.status_line",
    "app.modules.voice",
    "app.modules.water",
]
