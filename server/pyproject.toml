[project]
name = "ntu-shower-server"
version = "0.3.5"
description = "NTU 浴室系统服务端：设备网关 / 用户 API / 管理面 / OTA（FastAPI 模块化单体）"
requires-python = ">=3.10"
# 抽象依赖（兼容范围）。精确锁定版本见 requirements.txt——PyPA 标准分工：
# pyproject 表达"能兼容什么"，requirements.txt 表达"生产上跑什么"。
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "websockets>=17.0",
]

# ─────────────────────────────────────────────────────────────
# 代码风格强制机制（对应 docs/STANDARDS.md §1）
# ─────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（导入排序）
    "N",   # pep8-naming（命名规范）
    "UP",  # pyupgrade（现代语法）
    "B",   # flake8-bugbear（常见缺陷）
    "A",   # flake8-builtins（禁止遮蔽内建名）
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # ruff 专有规则
    "ANN", # flake8-annotations（类型注解完整性）
    "TRY", # tryceratops（异常处理规范）
    "BLE", # flake8-blind-except（禁止盲捕获）
    "EM",  # flake8-errmsg（异常消息规范）
    "PT",  # flake8-pytest-style（测试风格统一）
    "LOG", # flake8-logging
    "G",   # flake8-logging-format
    "TD",  # flake8-todos
]
ignore = [
    # 中文文档与注释中的全角标点是正常排版，非"视觉歧义字符"
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入的 File()/Header()/Depends() 默认值是框架标准用法
"app/**/routes.py" = ["B008"]
"app/**/dependencies.py" = ["B008"]
# pytest fixture 参数靠"声明"触发副作用（建隔离库、打补丁），不必然参与取值；
# 强制这些参数必须被使用等于与框架机制对抗，故在测试范围内豁免未用参数规则。
"tests/**" = ["ARG001", "ARG002"]

# ─────────────────────────────────────────────────────────────
# 类型检查强制机制（对应 docs/STANDARDS.md §1）
# ─────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# 测试与覆盖率门（对应 docs/STANDARDS.md §4）
# ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
# 单条用例的超时上限。正常用例在 1 秒内（最慢的是端口退避重试，1.25 秒），
# 超过 5 秒就说明它在等待一个永不到来的事件——例如权限被拒后，"等设备回帧"
# 的用例永远等不到。这道闸要卡得紧：宽到 30 秒等于没卡，一次挂起就是白等半分钟。
timeout = 5
timeout_method = "thread"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# 门槛跟随实际水平上移，只升不降（当前 96.2%，见 CI 输出）
fail_under = 96
show_missing = true
# 赦免机制：不可在测试进程内复现的分支须就地标注原因
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]
