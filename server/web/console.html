<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>NTU Shower · 管理台</title>
<link rel="stylesheet" href="plate.css">
<link rel="stylesheet" href="plate-console.css">
</head>
<body>
<div class="console">
  <header>
    <h1>NTU Shower · 管理台</h1>
    <span class="state-flash" id="state"></span>
    <span class="spacer"></span>
    <a href="index.html">用户看板</a>
  </header>

  <div class="tabs" role="tablist">
    <button data-tab="devices" aria-current="true">设备</button>
    <button data-tab="exec">远程执行</button>
    <button data-tab="config">配置</button>
    <button data-tab="ota">OTA 发布</button>
  </div>

  <section class="sheet" id="tab-devices">
    <div class="bar">
      <input id="token" type="password" placeholder="X-Admin-Token" style="width:280px">
      <button class="primary" id="saveToken">保存并加载</button>
      <button id="refreshDevices">刷新</button>
      <span class="grow"></span>
      <span class="hint">新设备上线后先在这里信任。</span>
    </div>
    <div class="rows" id="roster"></div>
  </section>

  <section class="sheet" id="tab-exec" hidden>
    <div class="bar">
      <select id="execDevice" aria-label="设备"><option value="">（保存令牌后加载设备）</option></select>
      <input id="execCmd" placeholder="命令" value="id; getprop ro.build.version.release" style="width:340px">
      <button class="primary" id="runCmd">执行</button>
      <button id="pullLogcat">拉取 logcat</button>
      <button id="battery">电量</button>
    </div>
    <pre class="term" id="execOut">输出会显示在这里。</pre>
  </section>

  <section class="sheet" id="tab-config" hidden>
    <div class="bar">
      <select id="cfgDevice" aria-label="配置目标">
        <option value="">全局默认</option>
      </select>
      <button id="loadConfig">载入</button>
      <button class="primary" id="saveConfig">保存并下发</button>
      <button class="danger" id="clearOverride">清除设备覆盖</button>
      <span class="grow"></span>
      <span class="hint">选择设备时编辑其覆盖配置；留空为全局默认。保存即实时下发。</span>
    </div>
    <div class="cfg-grid" id="cfgFields"></div>
  </section>

  <section class="sheet" id="tab-ota" hidden>
    <div class="bar">
      <input id="relVer" placeholder="版本号，如 0.2.5" style="width:140px">
      <input id="relCode" type="number" placeholder="version_code" style="width:130px">
      <label><input id="relMand" type="checkbox"> 强制更新</label>
      <label><input id="relForce" type="checkbox"> force 调试推送</label>
    </div>
    <div class="bar">
      <select id="relTarget" aria-label="目标设备"><option value="all">all（保存令牌后可定向）</option></select>
      <input id="relFile" type="file" accept=".apk">
      <button class="primary" id="uploadRelease">上传并发布</button>
    </div>
    <pre class="term" id="relOut"></pre>
    <h2>发布记录</h2>
    <div class="rows" id="releases"></div>
  </section>
</div>

<script src="core.js"></script>
<script src="console.js"></script>
</body>
</html>
