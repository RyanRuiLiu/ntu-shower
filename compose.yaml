services:
  migrate:
    image: ${NTU_SHOWER_IMAGE:?NTU_SHOWER_IMAGE must be set (registry path of the app image)}:${NTU_SHOWER_TAG:?NTU_SHOWER_TAG must be set}
    restart: "no"
    user: "997:997"
    env_file:
      - /etc/ntu-shower/ntu-shower.env
    environment:
      DB_PATH: /var/lib/ntu-shower/ntu-shower.db
    volumes:
      - /var/lib/ntu-shower:/var/lib/ntu-shower
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["alembic", "upgrade", "head"]

  ntu-shower:
    image: ${NTU_SHOWER_IMAGE:?NTU_SHOWER_IMAGE must be set (registry path of the app image)}:${NTU_SHOWER_TAG:?NTU_SHOWER_TAG must be set}
    container_name: ntu-shower
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    user: "997:997"
    env_file:
      - /etc/ntu-shower/ntu-shower.env
    environment:
      DB_PATH: /var/lib/ntu-shower/ntu-shower.db
      OTA_DIR: /var/lib/ntu-shower/ota_releases
      VOICE_DIR: /var/lib/ntu-shower/voice
    ports:
      - "127.0.0.1:8110:8110"
      - "127.0.0.1:15655-15664:15655-15664"
    volumes:
      - /var/lib/ntu-shower:/var/lib/ntu-shower
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/healthz', timeout=2)"]
      interval: 30s
      timeout: 30s
      start_period: 0s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  litestream:
    image: litestream/litestream:0.3@sha256:c5a1e1b01916b3a110f6600820ef176d048d9b9c2411ef0a680de0caa68934a5
    container_name: ntu-shower-litestream
    restart: unless-stopped
    user: "997:997"
    command: ["replicate", "-config", "/etc/ntu-shower/litestream.yml"]
    volumes:
      - /var/lib/ntu-shower:/var/lib/ntu-shower
      - /var/backups/ntu-shower/litestream:/var/backups/ntu-shower/litestream
      - /etc/ntu-shower/litestream.yml:/etc/ntu-shower/litestream.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
