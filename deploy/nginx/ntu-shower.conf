limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name ntu-shower.iseekdream.com;
    ssl_certificate /etc/letsencrypt/live/iseekdream.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iseekdream.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' wss://ntu-shower.iseekdream.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /gateway/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/voice/assets {
        client_max_body_size 21m;
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/ota/releases {
        client_max_body_size 51m;
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(api/v1|ota)(/|$) {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @rate_limited {
        add_header Retry-After 30 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' wss://ntu-shower.iseekdream.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        default_type application/problem+json;
        return 429 '{"type":"https://ntu-shower.iseekdream.com/problems/too-many-requests","title":"请求过于频繁","status":429,"detail":"请稍后重试"}';
    }
}

server {
    listen 80;
    server_name ntu-shower.iseekdream.com;
    return 301 https://$host$request_uri;
}
