# 速率限制（标准形态，NGINX 官方博客 + OWASP API4）：
# - 只限 API 面，静态资源不计入——页面刷新的资源突发是正常行为；
# - 一个 zone 一个速率，公开与已认证不区分（爆破面是"每个带身份的请求"）；
# - 超额 429 + Retry-After，让规范客户端知道何时重试；
# - 设备网关 /gateway/ 不限：长连接握手仅一次，限它只会误伤断网后的集中重连。
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name ntu-shower.iseekdream.com;
    ssl_certificate /etc/letsencrypt/live/iseekdream.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iseekdream.com/privkey.pem;

    # 安全响应头（server 级声明，location 未自定义 add_header 时全量继承）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /gateway/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API 面（统一限速；正则优先于前缀，静态路径自然落到下方不限速的 /）。
    # /api/v1 是对外 HTTP 面的唯一前缀；无前缀的只有设备硬编码契约 `/ota/manifest`，
    # 所以正则只留这两支。列举 `doors|devices|config|…` 那些模块名不会多拦任何东西
    # ——它们本就带 `/api/v1`——却会让人以为存在那些裸路径。/healthz 落下方 `location /`，
    # 探活不该被限速。
    location ~ ^/(api/v1|ota)(/|$) {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 网页静态资源：回源应用但不限速。升级头必须保留——/api/v1/stream 一旦因
    # 正则改动落到这里，缺了它实时推送就握手失败（历史事故，见 README）
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @rate_limited {
        add_header Retry-After 30 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        default_type application/problem+json;
        return 429 '{"type":"https://ntu-shower.iseekdream.com/problems/too-many-requests","title":"请求过于频繁","status":429,"detail":"请稍后重试"}';
    }
}

server {
    listen 80;
    server_name ntu-shower.iseekdream.com;
    return 301 https://$host$request_uri;
}
