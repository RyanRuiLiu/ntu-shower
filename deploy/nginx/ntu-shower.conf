# 速率限制（标准形态，NGINX 官方博客 + OWASP API4）：
# - 只限 API 面，静态资源不计入——页面刷新的资源突发是正常行为；
# - 一个 zone 一个速率，公开与已认证不区分（爆破面是"每个带身份的请求"）；
# - 超额 429 + Retry-After，让规范客户端知道何时重试；
# - 设备网关 /gateway/ 不限：长连接握手仅一次，限它只会误伤断网后的集中重连。
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name <public-domain>;
    ssl_certificate /etc/letsencrypt/live/<deploy-host>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<deploy-host>/privkey.pem;
    # TLS 策略在此声明（部署资产的唯一事实源）：纯 AEAD，不保留 CBC。
    # 设备端内置 Conscrypt 提供 AEAD（见 android core/tls/SecureTls.kt）。
    # ssl_ciphers 只管 TLS ≤1.2；TLS 1.3 的套件由 OpenSSL 默认提供（全 AEAD）。
    # 证书是单张 ECDSA 通配符，RSA 套件对它无效，故只列三个 AEAD ECDSA 套件；
    # 设备实测 ClientHello 顺序 CHACHA20 优先，prefer_server_ciphers off 让客户端
    # 顺序生效（协商结果 CHACHA20-POLY1305，见 docs/ARCHITECTURE.md「已定稿的传输层事实」）。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全响应头（server 级声明，location 未自定义 add_header 时全量继承）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 内容安全策略：脚本、样式与媒体只允许同源；图片额外允许 data:（检视页截图为 data URL）。
    # 运行时定位走 CSSOM 自定义属性，不需要 style-src 的 'unsafe-inline'。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' wss://<public-domain>; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /gateway/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 语音素材上传：服务端按文件本身限 20MB，nginx 默认 1MB 会在到达应用前
    # 就 413。多留 1MB 给 multipart 边界与表单字段。
    location = /api/v1/voice/assets {
        client_max_body_size 21m;
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API 面（统一限速；正则优先于前缀，静态路径自然落到下方不限速的 /）。
    # /api/v1 是对外 HTTP 面的唯一前缀；无前缀的只有设备硬编码契约 `/ota/manifest`，
    # 所以正则只留这两支。列举 `doors|devices|config|…` 那些模块名不会多拦任何东西
    # ——它们本就带 `/api/v1`——却会让人以为存在那些裸路径。/healthz 落下方 `location /`，
    # 探活不该被限速。
    location ~ ^/(api/v1|ota)(/|$) {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 网页静态资源：回源应用但不限速。升级头必须保留——/api/v1/stream 一旦因
    # 正则改动落到这里，缺了它实时推送就握手失败（历史事故，见 deploy/README.md）
    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @rate_limited {
        add_header Retry-After 30 always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # 内容安全策略：脚本、样式与媒体只允许同源；图片额外允许 data:（检视页截图为 data URL）。
    # 运行时定位走 CSSOM 自定义属性，不需要 style-src 的 'unsafe-inline'。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self' wss://<public-domain>; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        default_type application/problem+json;
        return 429 '{"type":"https://<public-domain>/problems/too-many-requests","title":"请求过于频繁","status":429,"detail":"请稍后重试"}';
    }
}

server {
    listen 80;
    server_name <public-domain>;
    return 301 https://$host$request_uri;
}
