name: keystore-recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: 还原 keystore 与签名配置
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > recovered/ntu-shower.keystore
          printf 'storeFile=<本机安全路径>/ntu-shower.keystore\nstorePassword=%s\nkeyAlias=ntu-shower\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > recovered/keystore.properties

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keystore-${{ github.run_id }}
          path: recovered/
          retention-days: 1
