name: keystore-recovery

# 签名密钥的恢复通路。keystore 与口令只存于仓库 secrets（KEYSTORE_B64 / KEYSTORE_PASSWORD），
# secrets 只能写不能读回，本地两份文件全丢时手动触发本 workflow，从 artifact 取回。
# 仓库里同时存着 example 模板，取回后按它补齐 gradle.properties 其余行。
on:
  workflow_dispatch:

# 工作流令牌按最小权限授予（与 ci.yml 同一取向）
permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: 还原 keystore 与签名配置
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p recovered/config/keystore
          echo "$KEYSTORE_B64" | base64 -d > recovered/config/keystore/ntu-shower.keystore
          printf 'keystorePassword=%s\nkeystoreAlias=ntu-shower\n' "$KEYSTORE_PASSWORD" > recovered/gradle.properties

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-${{ github.run_id }}
          path: recovered/
          # 忘了删也只留一天；签名密钥不该在 artifact 里过夜
          retention-days: 1
