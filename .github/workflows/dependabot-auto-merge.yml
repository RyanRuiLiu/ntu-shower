# Dependabot 自动合并（GitHub 官方模式，按 update-type 分档）：
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
# 分支保护已有 required checks：patch/minor 升级用官方 --auto，由 GitHub 在
# checks 全绿后自动合并——不再轮询 runner（旧行为每 PR 轮询数分钟，烧计费分钟）。
# major 与非 semver 升级不自动合并，留人工审阅。
name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: 解析更新类型
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
      - name: patch/minor 升级交官方 --auto（required checks 由 GitHub 等待）
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
