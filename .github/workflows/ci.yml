name: ci

# 与 README「质量门」小节逐条对应：本地跑绿即 CI 跑绿。
on:
  push:
    branches: [main]
  pull_request:

# 工作流令牌按最小权限授予（OpenSSF Scorecard: Token-Permissions）
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check app tests
      - run: ruff check app tests
      - run: mypy app --strict
      - run: pytest -q --cov=app --cov-report=term-missing

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew detekt :app:lintDebug :app:testDebugUnitTest :app:jacocoUnitTestCoverageVerification
      - run: ./gradlew assembleDebug
