name: ci

# 与 CONTRIBUTING「质量门」小节逐条对应：本地跑绿即 CI 跑绿。
on:
  push:
    branches: [main]
  pull_request:

# 工作流令牌按最小权限授予（OpenSSF Scorecard: Token-Permissions）
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与生产运行时一致，同时是 pyproject 声明的最低支持版本：
          # 只测更高版本会漏掉解释器差异（曾因此把 TypedDict 的兼容问题带上线）
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check app tests
      - run: ruff check app tests
      - run: mypy app --strict
      - run: pytest -q --cov=app --cov-report=term-missing

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 与本机发布构建（publish_apk.ps1 → assembleRelease）的 JDK 一致；源级别声明
          # 是 22（app/build.gradle.kts），21 连编译初始化都过不去——CI 曾因此从未绿过
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # 真实的 gradle.properties 已 gitignore（内含签名口令）；构建期要读 serverDomain
      # 与签名属性，CI 用 example 铺一份——占位口令够 detekt/lint/单测/assembleDebug 用
      - run: cp gradle.properties.example gradle.properties
      - run: ./gradlew detekt :app:lintDebug :app:testDebugUnitTest :app:jacocoUnitTestCoverageVerification
      - run: ./gradlew assembleDebug
