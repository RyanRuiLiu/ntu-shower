name: ci

# 与 CONTRIBUTING「质量门」小节逐条对应：本地跑绿即 CI 跑绿。
on:
  push:
    branches: [main]
  pull_request:

# 工作流令牌按最小权限授予（OpenSSF Scorecard: Token-Permissions）
permissions:
  contents: read

# 同分支的新推送取消在途运行：门禁只关心最新提交；main 上的构建同样如此。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Action 按完整 commit SHA 固定（OpenSSF Scorecard: Pinned-Dependencies），
      # 行尾注释记录所用主版本；升级 = 改 SHA + 改注释，一次一个 action。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 提交信息检查要读到基线之后的所有提交
          fetch-depth: 0
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          range=$(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          if [ -z "$range" ]; then
            exit 0
          fi
          status=0
          while IFS= read -r subject; do
            printf '%s' "$subject" > /tmp/commit-msg
            if ! sh ../.githooks/commit-msg /tmp/commit-msg; then
              status=1
            fi
          done <<< "$range"
          exit $status
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          # 压缩合并以 PR 标题作为提交摘要，必须走同一套规则
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$PR_TITLE" > /tmp/commit-msg
          sh ../.githooks/commit-msg /tmp/commit-msg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 与生产运行时一致，同时是 pyproject 声明的最低支持版本：
          # 只测更高版本会漏掉解释器差异（曾因此把 TypedDict 的兼容问题带上线）
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check app tests
      - run: ruff check app tests
      - run: mypy app --strict
      - run: lint-imports
      - run: semgrep scan --config p/python --config p/security-audit app --error --quiet
      # 项目自有规则（.semgrep.yml）：代码与配置不得引用已删除的文档或文档章节号。
      # markdownlint 只检查 .md，这类漂移只能在这里拦。
      - name: Project rules
        working-directory: .
        run: semgrep scan --config .semgrep.yml . --error --quiet
      # 并行度跟随 runner（addopts 里的 -n 6 在这里被 -n auto 覆盖）。
      # 此前的 -n 0 串行是拿配置回避 worker 崩溃；根因是后台任务把 ORM Session
      # 交给线程池跨线程使用（见 app/core/background.py），修复后不再需要。
      - run: pytest -q -n auto --cov=app --cov-report=term-missing
      - name: Markdown lint
        working-directory: .
        run: npx --yes markdownlint-cli2@0.20.0 "*.md" "docs/*.md" "docs/adr/*.md" "deploy/*.md" --config .markdownlint.json

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # 与本机发布构建（publish_apk.ps1 → assembleRelease）的 JDK 一致；源级别声明
          # 是 22（app/build.gradle.kts），21 连编译初始化都过不去——CI 曾因此从未绿过
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      # 真实的 gradle.properties 已 gitignore（内含签名口令）；构建期要读 serverDomain
      # 与签名属性，CI 用 example 铺一份——占位口令够 detekt/lint/单测/assembleDebug 用
      - run: cp gradle.properties.example gradle.properties
      - run: ./gradlew detekt :app:lintDebug :app:testDebugUnitTest :app:jacocoUnitTestCoverageVerification
      - run: ./gradlew assembleDebug

  # 秘密扫描与依赖漏洞扫描：
  # gitleaks 对全历史扫已入库的秘密；pip-audit 对锁定的依赖版本查 OSV 漏洞，
  # 高危与严重漏洞未修复时门禁红灯（修复前不得发布）。
  # pull-requests: read 是 gitleaks-action 在 PR 事件下列出提交所需（GET /pulls/*/commits）；
  # 门禁不授予任何写权限，泄漏以退出码报告。
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks 对全部历史扫描：秘密可能躺很久才被认出来
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR 事件下默认往 PR 写评论，那需要 pull-requests: write——门禁坚持最小权限
          # （contents: read），关掉评论改用退出码报泄漏；push main 的全历史扫描不走评论。
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt
        working-directory: server
