name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          range=$(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          if [ -z "$range" ]; then
            exit 0
          fi
          status=0
          while IFS= read -r subject; do
            printf '%s' "$subject" > /tmp/commit-msg
            if ! sh ../.githooks/commit-msg /tmp/commit-msg; then
              status=1
            fi
          done <<< "$range"
          exit $status
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$PR_TITLE" > /tmp/commit-msg
          sh ../.githooks/commit-msg /tmp/commit-msg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check app tests
      - run: ruff check app tests
      - run: mypy app --strict
      - run: lint-imports
      - run: pytest -q -n auto --cov=app --cov-report=term-missing
      - name: Markdown lint
        working-directory: .
        run: npx --yes markdownlint-cli2@0.20.0 "*.md" "docs/*.md" "docs/adr/*.md" "deploy/*.md" ".github/*.md" --config .markdownlint.json
      - name: Stylelint
        working-directory: .
        run: npx --yes stylelint@16 "server/web/style/*.css" --config server/web/.stylelintrc.json

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.184.0
      - run: semgrep scan --config p/python --config p/security-audit server/app --error --quiet
      - run: semgrep scan --config .semgrep.yml . --error --quiet

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: cp gradle.properties.example gradle.properties
      - run: ./gradlew detekt :app:lintDebug :app:testDebugUnitTest :app:jacocoUnitTestCoverageVerification
      - run: ./gradlew assembleDebug

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt
        working-directory: server
