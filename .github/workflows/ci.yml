name: ci

on:
  pull_request:

# main 推送不再重复跑 CI：同一 commit 在 PR 上已全量验证过，main 由
# docker→deploy 链守卫（构建+自动部署即发布门）。取舍：直推 main 不经
# 测试——本仓工作流全部经 PR。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 只取消 PR 的过期运行：main 是部署链的源头（docker→deploy），中途取消
  # 会把部署掐在半路。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 按改动面分发检查面。ci.yml 自身在 android/server 清单里：门禁逻辑的
  # 变更也要全量验证。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.semgrep.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'server/web/**'
            docs:
              - '**/*.md'

  server:
    needs: changes
    if: always()
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          range=$(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          if [ -z "$range" ]; then
            exit 0
          fi
          status=0
          while IFS= read -r subject; do
            printf '%s' "$subject" > /tmp/commit-msg
            if ! sh ../.githooks/commit-msg /tmp/commit-msg; then
              status=1
            fi
          done <<< "$range"
          exit $status
      - name: Check pull request title
        # dependabot 豁免：SHA→SHA bump 的机器标题结构性超过 72 字摘要上限，
        # 无法通过人工规范；其合并 subject 由合并时显式提供。
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.user.login, 'dependabot')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$PR_TITLE" > /tmp/commit-msg
          sh ../.githooks/commit-msg /tmp/commit-msg
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.server == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        if: needs.changes.outputs.server == 'true'
      - run: ruff format --check app tests
        if: needs.changes.outputs.server == 'true'
      - run: ruff check app tests
        if: needs.changes.outputs.server == 'true'
      - run: mypy app --strict
        if: needs.changes.outputs.server == 'true'
      - run: lint-imports
        if: needs.changes.outputs.server == 'true'
      - run: pytest -q -n auto --cov=app --cov-fail-under=96 --cov-report=term-missing
        if: needs.changes.outputs.server == 'true'
      - name: Markdown lint
        working-directory: .
        if: needs.changes.outputs.docs == 'true'
        run: npx --yes markdownlint-cli2@0.20.0 "*.md" "docs/*.md" "docs/adr/*.md" "deploy/*.md" ".github/*.md" --config .markdownlint.json
      - name: Web (eslint + stylelint)
        working-directory: server/web
        if: needs.changes.outputs.web == 'true'
        run: |
          npm ci
          npx eslint . --config eslint.config.mjs
          npx stylelint "style/*.css" --config .stylelintrc.json
      - name: Semgrep（安装：不进应用 venv，见 requirements-dev.txt 的说明）
        if: needs.changes.outputs.server == 'true'
        run: pip install semgrep==1.184.0
      - name: Semgrep（SAST：p/python + p/security-audit）
        if: needs.changes.outputs.server == 'true'
        run: semgrep scan --config p/python --config p/security-audit app --error --quiet
      - name: Semgrep（项目规则 .semgrep.yml，规则与扫描根都在仓库根）
        if: needs.changes.outputs.server == 'true'
        run: semgrep scan --config ../.semgrep.yml ../ --error --quiet

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: cp gradle.properties.example gradle.properties
      # 单次调用：org.gradle.caching 已开，未变任务命中缓存后这里只剩增量
      # 编译与测试执行（实测冷启动 171s 的最大杆已被缓存削平）。
      - run: ./gradlew detekt :app:lintDebug :app:testDebugUnitTest :app:jacocoUnitTestCoverageVerification assembleDebug

  security:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt
        working-directory: server
