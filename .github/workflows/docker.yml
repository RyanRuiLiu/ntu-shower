name: docker

# docker / build 是分支保护的 required check：PR 上必须每次都报告（GitHub 官方对
# required check 的要求），不能做 paths 过滤——整个 workflow 被跳过时没有 check run，
# 保护即无法满足。提速靠并发取消。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@f36af60bd552aa03e93fa1f4dff9b2ef9a963a65
    with:
      acr_registry: <registry>
      acr_namespace: <namespace>
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
