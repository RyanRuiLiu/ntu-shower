name: docker

# docker / build 是分支保护的 required check：PR 上必须每次都报告（GitHub 官方对
# required check 的要求），不能做 paths 过滤——整个 workflow 被跳过时没有 check run，
# 保护即无法满足。提速靠并发取消；main 上不取消——build→deploy 是生产链，
# 中途取消会把部署掐在半路。
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# 顶层零权限：docker job 的 packages: write 自行声明；deploy 用不到 GITHUB_TOKEN
# （SSH 凭据走 secrets），其余 job 一律不领令牌——依赖 Actions 默认值的继承面
# 是权限审计的盲区，显式声明为零。
permissions: {}

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@52617eaa392db38edad582cf088998fc7e63fdf2
    # registry/namespace 是部署侧私有值（同 compose 的 NTU_SHOWER_IMAGE）：经
    # secrets 块传入（workflow_call 的 with: 不支持 secrets 上下文），公开文件里
    # 只剩表达式，值由仓库 secrets 持有。共享仓对空值回退合法 local 名——fork PR
    # 拿不到 secrets 也能完成 build-only 校验。
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  # main 推送：镜像构建成功即滚动部署生产（pull → up → 健康探测，失败即红）。
  # 部署序列与 deploy/README.md 的人工步骤一致，只是由 CI 代为执行；镜像标签
  # 由 metadata 的 type=sha 产出（sha-<短哈希>），与本仓全部部署记录同形。
  # 临时手动门（2026-11-22）：迁移基准重置的生产切换需要人工序先于部署执行，
  # 切换完成后此行删除、恢复自动部署。
  deploy:
    needs: docker
    if: false
    runs-on: ubuntu-latest
    # 部署序列实测 40~70 秒（pull + up + healthz 探测 60s 上限）；挂起按额定分钟烧。
    timeout-minutes: 10
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -eu
            cd /opt/ntu-shower
            NTU_SHOWER_TAG=sha-${GITHUB_SHA::7} docker compose pull ntu-shower
            NTU_SHOWER_TAG=sha-${GITHUB_SHA::7} docker compose up -d
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://127.0.0.1:8110/healthz > /dev/null; then
                echo "deploy healthy (attempt $i)"
                exit 0
              fi
            done
            echo "health check failed after deploy" >&2
            exit 1
