# 依据：GitHub Docs "Reuse workflows"
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@3ab9093eb84a1aac7c942a25a473761fde8deec5
    with:
      acr_registry: <registry>
      acr_namespace: <namespace>
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
