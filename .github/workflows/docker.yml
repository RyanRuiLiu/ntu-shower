name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # 镜像内容只有 server/ 与 compose
    paths:
      - "server/**"
      - "compose.yaml"
      - ".github/workflows/docker.yml"

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@f36af60bd552aa03e93fa1f4dff9b2ef9a963a65
    with:
      acr_registry: crpi-5rhaq5x8z5ec9tig.cn-hangzhou.personal.cr.aliyuncs.com
      acr_namespace: ryanruiliu
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
