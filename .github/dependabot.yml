# Dependabot 依赖更新。官方文档：
# https://docs.github.com/en/code-security/dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    ignore:
      # 设备 ROM 冻结 Android 4.4（API 19，minSdk/targetSdk 不可动）：
      # okhttp 4.x 起要求 API 21，3.12.x 是支持 API 19 的最后一条线
      - dependency-name: "com.squareup.okhttp3:okhttp"
        versions: [">=3.13"]
      # conscrypt-android 2.9.0 抬高 minSdk（PR #14 manifest 合并冲突实测）
      - dependency-name: "org.conscrypt:conscrypt-android"
        versions: [">=2.9"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
