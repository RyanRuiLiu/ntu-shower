# Dependabot 依赖更新。官方文档：
# https://docs.github.com/en/code-security/dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
  # 网页端工具链（eslint/stylelint）：零构建单页 + npm lockfile
  - package-ecosystem: "npm"
    directory: "/server/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    ignore:
      # 设备 ROM 冻结 Android 4.4（API 19，minSdk/targetSdk 不可动）：
      # okhttp 4.x 起要求 API 21，3.12.x 是支持 API 19 的最后一条线
      - dependency-name: "com.squareup.okhttp3:okhttp"
        versions: [">=3.13"]
      # conscrypt-android 2.7.0/2.8.0/2.9.0 均抬高 minSdk（PR #14/#30/#32
      # manifest 合并冲突实测），API 19 兼容线止于 2.5.x
      - dependency-name: "org.conscrypt:conscrypt-android"
        versions: [">=2.6"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
